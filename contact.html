<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <link rel="stylesheet" type="text/css" href="style.css">

  <script src="theme.js"></script>
</head>
<body>

<header class="hero text-center">
  <div class="container">
    <h1>Contact</h1>

    <nav class="navbar navbar-expand navbar-dark">
      <ul class="navbar-nav mx-auto flex-wrap justify-content-center align-items-center">
        <li class="nav-item"><a class="nav-link" href="Home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="Accommodation.html">Accommodation</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        <li class="nav-item ms-3">
          <button id="themeButton" class="btn btn-sm btn-gold" type="button" onclick="changeTheme()">Dark mode</button>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main class="container my-4">
  <section>
    <h2 id="contact-heading"><u>Contact / Enquiry Form</u></h2>

    <div class="row">
      <div class="col-md-8">
        <form action="#" method="post">
          <div class="mb-3">
            <label for="fullname" class="form-label">Full Name:</label>
            <input type="text" class="form-control" id="fullname" name="fullname" required minlength="3">
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address:</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number:</label>
            <input type="tel" class="form-control" id="phone" name="phone" required>
          </div>
          
          <div class="mb-3">
            <label for="subject" class="form-label">Subject:</label>
            <input type="text" class="form-control" id="subject" name="subject" required>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message:</label>
            <textarea class="form-control" id="message" name="message" rows="6" required></textarea>
          </div>

          <div>
            <button type="submit" class="btn btn-submit me-2">Submit</button>
            <button type="reset" class="btn btn-reset">Reset</button>
          </div>
          
        </form>
      </div>
    </div>
  </section>

  <section id="booking" class="mt-5">
    <h2 id="booking-heading"><u>Booking Form and Cost Calculator</u></h2>

    <div class="row">
      <div class="col-md-7">
        <form id="bookingForm">

          <div class="mb-3">
            <label for="bookName" class="form-label">Full Name:</label>
            <input type="text" class="form-control" id="bookName" name="bookName" required minlength="3">
          </div>

          <div class="mb-3">
            <label for="bookEmail" class="form-label">Email Address:</label>
            <input type="email" class="form-control" id="bookEmail" name="bookEmail" required>
          </div>

          <div class="mb-3">
            <label for="bookPhone" class="form-label">Phone Number:</label>
            <input type="tel" class="form-control" id="bookPhone" name="bookPhone" required>
          </div>

          <div class="mb-3">
            <label for="lodge" class="form-label">Lodge:</label>
            <select class="form-select" id="lodge" name="lodge" onchange="calculate()" required>
              <option value="" selected> Choose a lodge</option>
              <option value="800">Qhanolla Guest House:M800</option>
              <option value="550">Maliba Lodge:M550</option>
              <option value="700">Afriski Mountain Resort:M700</option>
              <option value="500">Mmelesi Lodge:M500</option>
              <option value="1024">Avani Maseru:M1024</option>
              <option value="650">Malealea Lodge:M650</option>
            </select>
          </div>

          <div class="row">
            <div class="col-md-6">
          <div class="mb-3">
            <label for="checkin" class="form-label">Check-in Date:</label>
            <input type="date" class="form-control" id="checkin" name="checkin" required>
          </div>
            </div>

            <div class="col-md-3">
          <div class="mb-3">
            <label for="nights" class="form-label">Nights:</label>
            <input type="number" class="form-control" id="nights" name="nights" required min="1" max="30" value="1" oninput="calculate()">
          </div>
            </div>

            <div class="col-md-3">
          <div class="mb-3">
            <label for="rooms" class="form-label">Rooms:</label>
            <input type="number" class="form-control" id="rooms" name="rooms" required min="1" max="10" value="1" oninput="calculate()">
          </div>
            </div>
          </div>

          <div>
            <button type="submit" class="btn btn-submit me-2">Book Now</button>
            <button type="reset" class="btn btn-reset">Reset</button>
          </div>
        </form>
      </div>

      <aside class="col-md-5">
        <div class="info-box">
          <h3>Cost Summary</h3>
          <div id="costResult"></div>
        </div>
      </aside>
    </div>
  </section>

<nav class="mt-5">
  <ul class="pager">
    <li><a href="Accommodation.html"> Previous</a></li>
  </ul>
</nav>
</main>

<footer class="site-footer text-center">
 <div>&copy; 2026 All Rights Reseve </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
